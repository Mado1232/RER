<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="styles.css">
<style>
  body {
    margin: 0;
    padding: 20px;
    background: #f2f4f7;
    display: flex;
    justify-content: center;
  }
  .test-wrap {
    width: 360px;
    background: #ffffff;
    border-radius: 26px;
    overflow: hidden;
    position: relative;
  }
  .test-lower {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 12px 16px 28px;
    position: relative;
  }
  .test-qr-card {
    background: #ffffff;
    border-radius: 22px;
    padding: 10px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
    border: 1px solid #f3f4f6;
    display: inline-block;
    line-height: 0;
  }
  .test-qr-img {
    display: block;
    width: 195px;
    height: 195px;
    object-fit: contain;
    border-radius: 10px;
  }
  .test-id-line {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    margin-top: 20px;
    margin-bottom: 4px;
  }
  .test-id-label {
    color: #6b7280;
    font-size: 13px;
    font-weight: 400;
  }
  .test-id-value {
    color: #111827;
    font-size: 13.5px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>
  <div class="test-wrap">
    <div class="test-lower">
      <div class="test-qr-card">
        <img src="qr_code_clean_v4.png" class="test-qr-img">
      </div>
      <div class="test-id-line">
        <span class="test-id-label">Номер:</span>
        <span class="test-id-value">766 713</span>
      </div>
    </div>
  </div>
</body>
</html>
